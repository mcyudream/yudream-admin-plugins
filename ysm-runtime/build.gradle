subprojects {
    apply plugin: 'java-library'
    group = 'online.yudream.ysm'
    version = '0.2.0'
    repositories { mavenLocal(); mavenCentral(); maven { url = 'https://maven.fabricmc.net/' }; maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
    dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2' }
    test { useJUnitPlatform() }
}
