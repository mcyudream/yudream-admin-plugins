<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Map Development Preview</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: #0b0f1a; }
      button, input, select { font: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.__worldMapPreviewErrors = []
      window.addEventListener('error', (event) => window.__worldMapPreviewErrors.push(String(event.message)))
      window.addEventListener('unhandledrejection', (event) => window.__worldMapPreviewErrors.push(String(event.reason)))
      const previewConsoleError = console.error.bind(console)
      console.error = (...args) => {
        window.__worldMapPreviewErrors.push(args.map(String).join(' '))
        previewConsoleError(...args)
      }
    </script>
    <script type="module" src="/src/dev-preview.ts"></script>
  </body>
</html>
