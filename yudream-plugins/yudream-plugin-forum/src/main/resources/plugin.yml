name: forum
displayName: 论坛
description: 支持分类、标签、审核、互动与 YMCL 启动器浏览的社区论坛
icon: i-ri:forum-line
main: online.yudream.base.plugin.forum.bootstrap.ForumPlugin
version: 1.0.11
softdepend:
  - ymcl-adapter

# 移动端（YuDream Mobile 宿主）接入声明：主页卡片与展示元数据
mobile:
  platforms:
    - android
    - ios
  minHostVersion: 0.1.0
  requiredNativeCapabilities: []
  name: 论坛
  description: 社区讨论与最新动态
  icon: chatbubbles-outline
  home:
    feed:
      endpoint: /public/mobile-feed
      title: 论坛动态
    cards:
      - id: latest-posts
        title: 最新帖子
        description: 社区最新发布的帖子动态
        icon: flame-outline
        route: /latest
      - id: my-posts
        title: 我的帖子
        description: 我发布与参与的讨论
        icon: document-text-outline
        route: /mine
  admin:
    cards:
      - id: moderation
        title: 帖子审核
        description: 待审帖子放行与驳回
        icon: shield-checkmark-outline
        route: /admin
        permission: plugin:forum:manage
