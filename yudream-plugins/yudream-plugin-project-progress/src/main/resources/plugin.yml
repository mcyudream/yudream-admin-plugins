name: project-progress
displayName: 项目任务
description: 打卡、任务与验收
icon: checkbox-outline
main: online.yudream.base.plugin.projectprogress.bootstrap.ProjectProgressPlugin
version: 1.6.10
menu:
  # 一级共享分类，见宿主 docs/plugin-system/specification.md 第 10 节
  category: todo
# ymcl-adapter 先启：贡献页注册依赖其 API 类先于本插件加载
softdepend:
  - ymcl-adapter
# 移动端（YuDream Mobile 宿主）接入声明：项目任务
mobile:
  platforms:
    - android
    - ios
  minHostVersion: 0.1.0
  requiredNativeCapabilities: []
  name: 项目任务
  description: 打卡、任务与验收
  icon: checkbox-outline
  home:
    cards:
      - id: main
        title: 我的任务
        description: 打卡、任务与验收
        icon: checkbox-outline
        route: /tasks
  admin:
    cards:
      - id: acceptance
        title: 验收审批
        description: 任务验收的通过与驳回
        icon: checkmark-done-outline
        route: /acceptance
        permission: plugin:project-progress:manage
      - id: publish
        title: 发布任务
        description: 为项目发布新的认领任务
        icon: add-circle-outline
        route: /publish
        permission: plugin:project-progress:manage
