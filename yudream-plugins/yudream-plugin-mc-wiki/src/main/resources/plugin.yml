name: mc-wiki
displayName: Minecraft 百科
description: 管理 Minecraft 版本数据、物品资料、配方和公开百科页面。
icon: i-ri:book-open-line
main: online.yudream.base.plugin.mcwiki.bootstrap.McWikiPlugin
version: 2.1.4

# 移动端（YuDream Mobile 宿主）接入声明
mobile:
  platforms:
    - android
    - ios
  minHostVersion: 0.1.0
  requiredNativeCapabilities: []
  name: MC 百科
  description: 物品图鉴与合成配方速查
  icon: book-outline
  home:
    cards:
      - id: browse
        title: 物品图鉴
        description: 搜索物品、方块与合成配方
        icon: search-outline
        route: /latest
