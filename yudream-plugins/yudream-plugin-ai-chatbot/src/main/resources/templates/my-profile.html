<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    #profile-card { width: 760px; padding: 28px; background: #f4f6fb; }
    .card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 28px rgba(30, 41, 59, 0.10); }
    .hero { display: flex; align-items: center; gap: 20px; padding: 28px 32px; background: linear-gradient(120deg, #eef4ff 0%, #f6efff 55%, #fff 100%); }
    .avatar { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #dbeafe; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: #3b82f6; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(59, 130, 246, 0.25); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .who h1 { margin: 0; font-size: 26px; color: #0f172a; }
    .who p { margin: 6px 0 0; font-size: 14px; color: #64748b; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 18px 32px; border-bottom: 1px solid #f1f5f9; }
    .stat { padding: 12px 16px; background: #f8fafc; border-radius: 12px; }
    .stat .num { font-size: 22px; font-weight: 700; color: #1d4ed8; }
    .stat .label { margin-top: 2px; font-size: 12px; color: #64748b; }
    .section { padding: 18px 32px; border-bottom: 1px solid #f1f5f9; }
    .section:last-child { border-bottom: 0; }
    .section h2 { margin: 0 0 10px; font-size: 15px; color: #4f46e5; letter-spacing: 1px; }
    .section h2::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #818cf8; vertical-align: 2px; }
    .section p.text { margin: 0; font-size: 14px; line-height: 1.9; color: #334155; white-space: pre-wrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 5px 14px; font-size: 13px; color: #4338ca; background: #eef2ff; border-radius: 999px; }
    .facts { display: flex; flex-direction: column; gap: 8px; }
    .fact { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: #f8fafc; border-radius: 10px; }
    .fact .type { flex-shrink: 0; padding: 2px 10px; font-size: 12px; color: #0369a1; background: #e0f2fe; border-radius: 999px; }
    .fact .value { font-size: 14px; color: #1e293b; }
    .footer { padding: 14px 32px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
<div id="profile-card">
  <div class="card">
    <div class="hero">
      <div class="avatar">
        <img th:if="${avatar != null and !avatar.isEmpty()}" th:src="${avatar}" alt="">
        <span th:if="${avatar == null or avatar.isEmpty()}" th:text="${nickname.substring(0, 1)}">昵</span>
      </div>
      <div class="who">
        <h1 th:text="${nickname}">昵称</h1>
        <p>这是机器人在本群为你生成的画像 · 只读展示</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" th:text="${observed}">0</div><div class="label">互动消息</div></div>
      <div class="stat"><div class="num" th:text="${triggered}">0</div><div class="label">对话触发</div></div>
      <div class="stat"><div class="num" th:text="${completed}">0</div><div class="label">完成回复</div></div>
    </div>
    <div class="section" th:if="${personality != null and !personality.isEmpty()}">
      <h2>人格画像</h2>
      <p class="text" th:text="${personality}">人格分析</p>
    </div>
    <div class="section" th:if="${interactionStyle != null and !interactionStyle.isEmpty()}">
      <h2>互动风格</h2>
      <p class="text" th:text="${interactionStyle}">互动风格</p>
    </div>
    <div class="section" th:if="${(personality == null or personality.isEmpty()) and summary != null and !summary.isEmpty()}">
      <h2>画像摘要</h2>
      <p class="text" th:text="${summary}">摘要</p>
    </div>
    <div class="section" th:if="${tags != null and !tags.isEmpty()}">
      <h2>标签</h2>
      <div class="tags"><span class="tag" th:each="tag : ${tags}" th:text="${tag}">标签</span></div>
    </div>
    <div class="section" th:if="${facts != null and !facts.isEmpty()}">
      <h2>关于你</h2>
      <div class="facts">
        <div class="fact" th:each="fact : ${facts}">
          <span class="type" th:text="${fact.type}">偏好</span>
          <span class="value" th:text="${fact.value}">内容</span>
        </div>
      </div>
    </div>
    <div class="footer">画像由 AI 根据群内发言整理，仅供参考 · 发送 /我的画像 可随时再次查看</div>
  </div>
</div>
</body>
</html>
