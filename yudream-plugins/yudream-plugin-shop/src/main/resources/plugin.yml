name: shop
displayName: 商店
description: 玩家市场与积分商城分离呈现，多图与 Markdown 详情、钱包支付购买，开放商品类型与自动发货扩展点。
icon: i-ri:store-2-line
main: online.yudream.base.plugin.shop.bootstrap.ShopPlugin
version: 1.2.1
softdepend:
  - yudream-wallet

# 移动端（YuDream Mobile 宿主）接入声明
mobile:
  platforms:
    - android
    - ios
  minHostVersion: 0.1.0
  requiredNativeCapabilities: []
  name: 积分商城
  description: 逛商城、买商品、管订单
  icon: cart-outline
  home:
    cards:
      - id: plaza
        title: 积分商城
        description: 用积分兑换心仪商品
        icon: pricetag-outline
        route: /plaza
      - id: orders
        title: 我的订单
        description: 订单与核销码
        icon: receipt-outline
        route: /orders
