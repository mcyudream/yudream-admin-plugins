name: shop
displayName: 积分商城
description: 逛商城、买商品、管订单
icon: cart-outline
main: online.yudream.base.plugin.shop.bootstrap.ShopPlugin
version: 1.3.3

# 移动端（YuDream Mobile 宿主）接入声明：积分商城
mobile:
  platforms:
    - android
    - ios
  minHostVersion: 0.1.0
  requiredNativeCapabilities: []
  name: 积分商城
  description: 逛商城、买商品、管订单
  icon: cart-outline
  home:
    cards:
      - id: main
        title: 积分商城
        description: 逛商城、买商品、管订单
        icon: cart-outline
        route: /plaza
  admin:
    cards:
      - id: admin
        title: 商店管理
        description: 商品上下架与订单处理
        icon: settings-outline
        route: /admin
        permission: plugin:shop:manage
