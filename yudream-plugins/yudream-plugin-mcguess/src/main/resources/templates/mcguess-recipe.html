<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #mcguess-recipe-card { display: inline-block; background: #1b1a17; padding: 20px 24px; border-radius: 16px; border: 2px solid #3d3a33; }
    .head { display: flex; align-items: center; gap: 10px; }
    .head img { width: 32px; height: 32px; image-rendering: pixelated; }
    .head h1 { margin: 0; font-size: 20px; color: #f4c542; }
    .head .sub { font-size: 12px; color: #8f887a; }
    .craft { display: flex; align-items: center; gap: 16px; margin-top: 14px; justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 5px; }
    .cell { width: 58px; height: 58px; border-radius: 6px; border: 2px solid #4a463d; background: #2a2822; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .cell.empty { background: #141310; border-color: #26241f; }
    .cell img { width: 38px; height: 38px; image-rendering: pixelated; }
    .cell .name { font-size: 10px; color: #e8ddc0; max-width: 54px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .arrow { font-size: 24px; color: #f4c542; }
    .result { width: 70px; height: 70px; border-radius: 8px; border: 2px solid #f4c542; background: #35321f; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .result img { width: 42px; height: 42px; image-rendering: pixelated; }
    .result .count { font-size: 11px; color: #f4c542; font-weight: 700; }
    .foot { margin-top: 12px; font-size: 11px; color: #6b6557; text-align: center; }
  </style>
</head>
<body>
<div id="mcguess-recipe-card">
  <div class="head">
    <img th:if="${itemIcon != null}" th:src="${itemIcon}" alt="">
    <h1 th:text="${itemZh}">钻石</h1>
    <span class="sub" th:text="'本局目标配方第 ' + ${cellIndex} + ' 格'">第 1 格</span>
  </div>
  <div class="craft">
    <div class="grid">
      <div th:each="cell : ${cells}" th:class="'cell ' + ${cell.state}">
        <th:block th:if="${cell.state == 'shown'}">
          <img th:if="${cell.icon != null}" th:src="${cell.icon}" alt="">
          <span class="name" th:text="${cell.zh}">木棍</span>
        </th:block>
      </div>
    </div>
    <div class="arrow">➜</div>
    <div class="result">
      <img th:if="${itemIcon != null}" th:src="${itemIcon}" alt="">
      <span class="count" th:if="${count > 1}" th:text="'×' + ${count}"></span>
    </div>
  </div>
  <div class="foot">图标素材 ccvaults.com · 数据截止 JE 1.20.5</div>
</div>
</body>
</html>
