<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #mcguess-card { display: inline-block; background: #1b1a17; padding: 22px 26px; border-radius: 16px; border: 2px solid #3d3a33; }
    .head { display: flex; align-items: baseline; gap: 12px; }
    .head h1 { margin: 0; font-size: 23px; letter-spacing: 2px; color: #f4c542; text-shadow: 0 1px 0 #000; }
    .head .sub { font-size: 12px; color: #8f887a; }
    .craft { display: flex; align-items: center; gap: 18px; margin-top: 16px; justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(3, 62px); gap: 5px; }
    .cell { width: 62px; height: 62px; border-radius: 6px; border: 2px solid #4a463d; background: #2a2822; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .cell.empty { background: #141310; border-color: #26241f; }
    .cell.hidden { background: #211f1a; }
    .cell.hidden .q { font-size: 24px; font-weight: 700; color: #57523f; }
    .cell.shown { background: #35321f; border-color: #f4c542; }
    .cell img { width: 40px; height: 40px; image-rendering: pixelated; }
    .cell .name { font-size: 10px; color: #e8ddc0; max-width: 58px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .arrow { font-size: 26px; color: #f4c542; }
    .result { width: 74px; height: 74px; border-radius: 8px; border: 2px solid #f4c542; background: #35321f; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .result img { width: 46px; height: 46px; image-rendering: pixelated; }
    .result .q { font-size: 30px; font-weight: 700; color: #f4c542; }
    .result .name { font-size: 11px; color: #e8ddc0; max-width: 70px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .result .count { font-size: 11px; color: #f4c542; font-weight: 700; }
    .meta { margin-top: 12px; display: flex; gap: 12px; font-size: 12px; color: #8f887a; justify-content: center; flex-wrap: wrap; }
    .meta .hl { color: #f4c542; font-weight: 600; }
    .records { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .rec { display: flex; align-items: center; gap: 8px; background: #24221c; border-radius: 6px; padding: 4px 10px; font-size: 13px; color: #d8d2c2; }
    .rec img { width: 24px; height: 24px; image-rendering: pixelated; }
    .rec .noicon { width: 24px; height: 24px; display: inline-block; }
    .rec .zh { font-weight: 600; }
    .rec .occ { color: #8f887a; font-size: 11px; }
    .rec .tag { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
    .rec.win .tag { background: #f4c542; color: #1b1a17; font-weight: 700; }
    .rec.found .tag { background: #3f6b3a; color: #dff0da; }
    .rec.miss .tag { background: #40373a; color: #b9a9ad; }
    .rec .qq { color: #6b6557; font-size: 11px; }
    .banner { margin-top: 12px; font-size: 13px; line-height: 1.7; color: #e8ddc0; white-space: pre-wrap; }
    .foot { margin-top: 12px; font-size: 11px; color: #6b6557; text-align: center; }
  </style>
</head>
<body>
<div id="mcguess-card">
  <div class="head">
    <h1 th:text="${title}">MC 猜物</h1>
    <span class="sub" th:text="${subtitle}">2026-08-21 · 数据截止 JE 1.20.5</span>
  </div>
  <div class="craft">
    <div class="grid">
      <div th:each="cell : ${cells}" th:class="'cell ' + ${cell.state}">
        <th:block th:if="${cell.state == 'shown'}">
          <img th:if="${cell.icon != null}" th:src="${cell.icon}" alt="">
          <span class="name" th:text="${cell.zh}">钻石</span>
        </th:block>
        <span th:if="${cell.state == 'hidden'}" class="q">?</span>
      </div>
    </div>
    <div class="arrow">➜</div>
    <div class="result">
      <th:block th:if="${ended}">
        <img th:if="${targetIcon != null}" th:src="${targetIcon}" alt="">
        <span class="name" th:text="${targetZh}">钻石剑</span>
        <span class="count" th:if="${targetCount > 1}" th:text="'×' + ${targetCount}"></span>
      </th:block>
      <span th:if="${!ended}" class="q">?</span>
    </div>
  </div>
  <div class="meta">
    <span>已猜 <span class="hl" th:text="${guessCount}">0</span> 次</span>
    <span>配方格 <span class="hl" th:text="${gridRevealed + '/' + gridTotal}">0/0</span></span>
    <span th:if="${!ended}">提示 <span class="hl" th:text="${hintAvailable} ? '可用！发送 /猜物提示' : (${emptyStreak + '/' + hintNeed})">0/6</span></span>
    <span th:if="${won}">胜者 <span class="hl" th:text="'QQ ' + ${winnerQq}">QQ</span></span>
    <span th:if="${lost}" class="hl">本局已揭晓</span>
  </div>
  <div class="records" th:if="${!records.isEmpty()}">
    <div th:each="rec : ${records}" th:class="'rec ' + ${rec.cls}">
      <img th:if="${rec.icon != null}" th:src="${rec.icon}" alt="">
      <span th:if="${rec.icon == null}" class="noicon"></span>
      <span class="zh" th:text="${rec.zh}">钻石</span>
      <span class="occ" th:if="${rec.occurrences > 0}" th:text="'×' + ${rec.occurrences}"></span>
      <span class="qq" th:text="${rec.qq}">123456</span>
      <span class="tag" th:text="${rec.label}">距离 1</span>
    </div>
  </div>
  <div class="banner" th:if="${banner != null and !banner.isEmpty()}" th:text="${banner}"></div>
  <div class="foot">/猜物 &lt;物品名&gt; 参与 · /猜物格子 1-9 查看格子配方 · /结束猜物 投降 · 图标素材 ccvaults.com</div>
</div>
</body>
</html>
