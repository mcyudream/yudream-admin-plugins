<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #mcguess-mob-card { display: inline-block; background: #1b1a17; padding: 22px 26px; border-radius: 16px; border: 2px solid #3d3a33; }
    .head { display: flex; align-items: baseline; gap: 12px; }
    .head h1 { margin: 0; font-size: 23px; letter-spacing: 2px; color: #7ec96b; text-shadow: 0 1px 0 #000; }
    .head .sub { font-size: 12px; color: #8f887a; }
    .board { display: grid; grid-template-columns: 96px repeat(3, 76px); grid-auto-rows: minmax(30px, auto); gap: 5px; margin-top: 16px; justify-content: center; }
    .corner { display: flex; align-items: center; justify-content: center; font-size: 10px; color: #57523f; }
    .cond { display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 6px; border: 2px solid #3d4a33; background: #232a1c; color: #b9d8a6; font-size: 12px; font-weight: 600; padding: 4px 6px; line-height: 1.3; }
    .cell { width: 76px; height: 76px; border-radius: 6px; border: 2px solid #4a463d; background: #2a2822; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .cell .idx { position: absolute; top: 2px; left: 5px; font-size: 10px; color: #57523f; }
    .cell.empty { background: #141310; border-color: #26241f; }
    .cell.filled { background: #26331f; border-color: #7ec96b; }
    .cell.solution { background: #33231f; border-color: #a96b5e; border-style: dashed; }
    .cell img { width: 42px; height: 42px; image-rendering: pixelated; }
    .cell .name { font-size: 10px; color: #e8ddc0; max-width: 72px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cell.solution .name { color: #d8a79b; }
    .meta { margin-top: 12px; display: flex; gap: 12px; font-size: 12px; color: #8f887a; justify-content: center; flex-wrap: wrap; }
    .meta .hl { color: #7ec96b; font-weight: 600; }
    .meta .hearts { letter-spacing: 1px; }
    .records { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .rec { display: flex; align-items: center; gap: 8px; background: #24221c; border-radius: 6px; padding: 4px 10px; font-size: 13px; color: #d8d2c2; }
    .rec img { width: 24px; height: 24px; image-rendering: pixelated; }
    .rec .noicon { width: 24px; height: 24px; display: inline-block; }
    .rec .zh { font-weight: 600; }
    .rec .tag { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
    .rec.found .tag { background: #3f6b3a; color: #dff0da; }
    .rec.miss .tag { background: #40373a; color: #b9a9ad; }
    .rec .qq { color: #6b6557; font-size: 11px; }
    .banner { margin-top: 12px; font-size: 13px; line-height: 1.7; color: #e8ddc0; white-space: pre-wrap; }
    .foot { margin-top: 12px; font-size: 11px; color: #6b6557; text-align: center; }
  </style>
</head>
<body>
<div id="mcguess-mob-card">
  <div class="head">
    <h1 th:text="${title}">MC 猜生物</h1>
    <span class="sub" th:text="${subtitle}">填格子 · 同盘不重复 · JE 1.20.5</span>
  </div>
  <div class="board">
    <div class="corner">行＼列</div>
    <div class="cond" th:each="col : ${cols}" th:text="${col.zh}">主世界</div>
    <th:block th:each="row, rowStat : ${rows}">
      <div class="cond" th:text="${row.zh}">友好</div>
      <div th:each="colIdx : ${#numbers.sequence(0, 2)}"
           th:with="cell=${cells[rowStat.index * 3 + colIdx]}"
           th:class="'cell ' + ${cell.state}">
        <span class="idx" th:text="${cell.index}">1</span>
        <th:block th:if="${cell.state != 'empty'}">
          <img th:if="${cell.icon != null}" th:src="${cell.icon}" alt="">
          <span class="name" th:text="${cell.zh}">僵尸</span>
        </th:block>
      </div>
    </th:block>
  </div>
  <div class="meta">
    <span>已填 <span class="hl" th:text="${filled + '/9'}">0/9</span> 格</span>
    <span th:if="${!ended}">剩余 <span class="hl hearts" th:text="'❤️ ×' + ${hearts} + '/' + ${heartsMax}">❤️ ×6/6</span></span>
    <span>有效填格 <span class="hl" th:text="${guessCount}">0</span> 次</span>
    <span th:if="${won}">胜者 <span class="hl" th:text="'QQ ' + ${winnerQq}">QQ</span></span>
    <span th:if="${lost}" class="hl">已揭晓参考答案</span>
  </div>
  <div class="records" th:if="${!records.isEmpty()}">
    <div th:each="rec : ${records}" th:class="'rec ' + ${rec.cls}">
      <img th:if="${rec.icon != null}" th:src="${rec.icon}" alt="">
      <span th:if="${rec.icon == null}" class="noicon"></span>
      <span class="zh" th:text="${rec.zh}">僵尸</span>
      <span class="qq" th:text="${rec.qq}">123456</span>
      <span class="tag" th:text="${rec.label}">填入 1 格</span>
    </div>
  </div>
  <div class="banner" th:if="${banner != null and !banner.isEmpty()}" th:text="${banner}"></div>
  <div class="foot">/猜生物 &lt;1-9&gt; &lt;生物名&gt; 填格 · 同盘答案不重复 · /结束猜生物 投降 · 图标素材 ccvaults.com</div>
</div>
</body>
</html>
