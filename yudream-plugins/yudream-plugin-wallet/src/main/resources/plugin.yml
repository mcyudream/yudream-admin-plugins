name: yudream-wallet
displayName: 用户钱包
description: 管理余额、积分、充值、转账和资产流水。
icon: i-ri:wallet-3-line
main: online.yudream.base.plugin.wallet.bootstrap.WalletPlugin
version: 1.1.8
softdepend:
  - yudream-skin

# 移动端（YuDream Mobile 宿主）接入声明
mobile:
  platforms:
    - android
    - ios
  minHostVersion: 0.1.0
  requiredNativeCapabilities: []
  name: 钱包
  description: 余额、流水与充值
  icon: wallet-outline
  home:
    cards:
      - id: home
        title: 我的钱包
        description: 余额与充值
        icon: wallet-outline
        route: /wallet
